# pgas-new tier-1 canary (callable) — CONSUMER-CANARY-CONTRACT.md § 1, § 5.2.
#
# Invoked cross-repo by pgas's publish workflow on every `v*-rc` tag. Its
# `verdict` output gates promotion of the release candidate: pgas publishes only
# if every opted-in consumer returns `pass`.
#
# pgas-new is a CANONICAL consumer (it depends on @simodelne/pgas-server) but a
# POD-LESS one — no backend, no container, no deploy target. So, unlike the
# simoneos reference (§ 8), there is no image build and no pod SSH here, and the
# only secret declared is the pgas-mandated `CROSS_CANARY_PAT`. Precedent for a
# pod-less consumer: `pgas-sysadmin` and `pgas-coder` in § 9.
#
# Why pgas-new is worth a release gate at all: it is the only consumer that
# SYNTHESIZES PGAS programs against the engine's declarative surface, so it
# catches breaking changes to the authoring grammar and to the published `.d.ts`
# that a running application would never notice.
name: pgas-new tier-1 canary (callable)

# Consumer-canary contract version this callable DEFINITION implements.
# `qc/scripts/verify-consumer-sha.sh` greps this exact key out of the definition
# checked out at `consumer-sha`; a skew between the running definition and that
# one means the caller's `uses:@SHA` and `consumer-sha:` disagree.
env:
  CONSUMER_CANARY_CONTRACT: 3.0.0

on:
  workflow_call:
    inputs:
      # ---- contract 3.0.0 (pgas#1122 / pgas-new#335) ----
      # REQUIRED and deliberately NOT defaulted. A default would silently
      # reintroduce contract 2.x's mutable-`main` behaviour the first time a
      # caller forgot to pass it, which is the exact failure this contract
      # exists to remove. Absent input => GitHub rejects the call at graph build.
      consumer-sha:
        description: 'Exact full 40-hex pgas-new commit SHA to test (immutable; never a branch or tag)'
        required: true
        type: string
      # NOTE for the pgas-side caller: the § 5.4 template lists only the first
      # three. The simoneos reference and `qc/verify-candidate-manifest.mjs`
      # both require `pgas-rc-sha` and `candidate-manifest-sha256` as well —
      # they are what make the rc tarballs IMMUTABLE rather than merely named.
      # All five are required here.
      pgas-rc-tag:
        description: 'pgas release-candidate tag (e.g. v6.1.2-rc)'
        required: true
        type: string
      pgas-rc-run-id:
        description: 'pgas release-candidate workflow run ID (artifact source)'
        required: true
        type: string
      pgas-rc-repo:
        description: 'pgas repo in owner/repo form'
        required: true
        type: string
      pgas-rc-sha:
        description: 'Exact pgas release-candidate commit SHA'
        required: true
        type: string
      candidate-manifest-sha256:
        description: 'Exact candidate manifest SHA-256'
        required: true
        type: string
    outputs:
      verdict:
        description: 'pass | fail | skip'
        value: ${{ jobs.canary.outputs.verdict }}
      evidence-artifact:
        description: 'name of the uploaded evidence artifact'
        value: ${{ jobs.canary.outputs.evidence-artifact }}
      classification:
        description: 'ok | config_infra — a consumer-sha/callable identity fault is a release-plumbing fault, never a consumer product regression (pgas#1122)'
        value: ${{ jobs.canary.outputs.classification }}
      consumer-sha-tested:
        description: 'the exact consumer commit whose bytes were tested'
        value: ${{ jobs.canary.outputs.consumer-sha-tested }}
    secrets:
      # Pgas-mandated (§ 1.3). This is the ONLY secret pgas-new needs: no pod to
      # reach, no registry to push to.
      CROSS_CANARY_PAT:
        required: true

jobs:
  canary:
    # htpc pool. pgas-new needs no GPU, but `gpu-pod` is the label every
    # htpc self-hosted runner carries under the fleet's htpc-only CI policy.
    runs-on: [self-hosted, gpu-pod]
    # § 3 asks new consumers to target <15 minutes. pgas-new's canary is a
    # typecheck plus six hermetic integration files, so this ceiling is
    # generous; it exists to bound a hang, not to budget the work.
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      evidence-artifact: ${{ steps.evidence-name.outputs.name }}
      classification: ${{ steps.verdict.outputs.classification }}
      consumer-sha-tested: ${{ steps.identity.outputs.actual_head }}

    steps:
      - name: Checkout pgas-new
        # `repository` + `ref` + `token` are all REQUIRED here, not optional
        # tidiness. In a cross-repo `workflow_call` the default checkout resolves
        # `github.repository` to the CALLER (pgas), so a bare checkout would clone
        # pgas into `pgas-new/` and the canary would never find its own executor.
        # The simoneos reference documents the same trap (pgas publish run
        # 26149949176). The caller-scope GITHUB_TOKEN cannot read another private
        # repo, hence the pgas-mandated PAT.
        #
        # CONTRACT 3.0.0: `ref` is the caller-declared immutable `consumer-sha`,
        # NOT `main`. Under 2.x this said `ref: main` and argued that testing
        # "pgas-new as it is now" was the point; that made a `pass` certify a
        # moment rather than an artifact, because the same pinned callable could
        # test different consumer bytes on two runs. PGAS now binds `uses:@HEAD`
        # and `consumer-sha: HEAD` to the same value, and the identity gate below
        # refuses to run the product tests if disk disagrees with the request.
        uses: actions/checkout@v4
        with:
          repository: simodelne/pgas-new
          ref: ${{ inputs.consumer-sha }}
          token: ${{ secrets.CROSS_CANARY_PAT }}
          path: pgas-new

      - name: Checkout pgas (for the htpc artifact action + manifest verifier)
        # In a cross-repo workflow_call the default token cannot read the pgas
        # repo, so the pgas-mandated PAT is used here as well as for the
        # artifact download itself.
        #
        # ORDERED BEFORE THE IDENTITY GATE DELIBERATELY. `Upload evidence` uses a
        # LOCAL action from `./pgas/.github/actions/upload-artifact-htpc`. If this
        # checkout ran after the gate, an identity fault would leave `pgas/`
        # absent, the `always()` upload would die resolving its own action, and
        # the durable tuple the gate writes before exiting would be discarded —
        # losing the evidence on exactly the failure the gate exists to record.
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pgas-rc-repo }}
          ref: ${{ inputs.pgas-rc-sha }}
          token: ${{ secrets.CROSS_CANARY_PAT }}
          path: pgas

      - name: Same-byte consumer identity gate (contract 3.0.0)
        id: identity
        # See FIX-1 note in the verdict step: an identity fault must not fail the
        # JOB, or GitHub drops this callable's outputs and the caller can never
        # read verdict=skip / classification=config_infra.
        continue-on-error: true
        env:
          # Interpolating `${{ inputs.consumer-sha }}` straight into `run:` would
          # execute caller-controlled text on a self-hosted runner BEFORE the
          # validation below can reject it — the validator would be the injection
          # site. Via env it is inert data.
          CONSUMER_SHA: ${{ inputs.consumer-sha }}
        # RUNS BEFORE THE RC IS EVEN FETCHED. A consumer-identity fault must not
        # burn a product test run, and must never be able to produce a product
        # signal at all — if we cannot say WHICH bytes we tested, any pass/fail
        # from those bytes is uninterpretable.
        #
        # The gate lives in a script rather than inline YAML so the retained
        # kill-proof in tests/unit/canary-consumer-sha-gate.test.ts executes the
        # EXACT bytes this step runs, instead of asserting against a YAML string
        # that could drift away from the logic it claims to describe.
        #
        # Exit 3 => config_infra (release-plumbing fault). Never exit 1, which is
        # reserved for a genuine consumer product regression (pgas#1122).
        run: |
          bash pgas-new/qc/scripts/verify-consumer-sha.sh \
            --requested "$CONSUMER_SHA" \
            --actual "$(git -C pgas-new rev-parse HEAD)" \
            --contract "${CONSUMER_CANARY_CONTRACT}" \
            --callable-file pgas-new/.github/workflows/tier1-canary-callable.yml \
            --evidence "pgas-new/qc/evidence/${{ github.run_id }}/canary.log"

      - name: Download pgas rc tarballs (from htpc — pgas#442)
        if: steps.identity.outcome == 'success'
        # pgas#442 migrated rc tarballs off GitHub's artifact store onto htpc.
        # Reading the GitHub store here would silently find nothing.
        uses: ./pgas/.github/actions/download-artifact-htpc
        with:
          name: pgas-release-candidate-${{ inputs.pgas-rc-tag }}
          path: pgas-new/pgas-rc/
          run-id: ${{ inputs.pgas-rc-run-id }}
          source-repository: ${{ inputs.pgas-rc-repo }}

      - name: Verify exact candidate manifest and packages
        if: steps.identity.outcome == 'success'
        # IMMUTABILITY GATE. Proves the tarballs are byte-for-byte the ones the
        # rc run produced, bound to that exact commit SHA and manifest digest —
        # so a `pass` certifies a specific artifact, not merely a tag name.
        run: |
          node pgas/qc/verify-candidate-manifest.mjs \
            --directory pgas-new/pgas-rc \
            --repository "${{ inputs.pgas-rc-repo }}" \
            --rc-tag "${{ inputs.pgas-rc-tag }}" \
            --run-id "${{ inputs.pgas-rc-run-id }}" \
            --rc-sha "${{ inputs.pgas-rc-sha }}" \
            --manifest-sha256 "${{ inputs.candidate-manifest-sha256 }}"

      - name: Record exact consumer bytes under test
        if: steps.identity.outcome == 'success'
        # Content-free provenance. Under contract 3.0.0 the commit is declared by
        # the caller rather than discovered, but it is still recorded here so the
        # evidence artifact stands alone. APPENDS: the identity gate above
        # already created canary.log and wrote the durable identity tuple into
        # it, and truncating here would destroy exactly the record a mismatch
        # post-mortem needs.
        run: |
          head_sha="$(git -C pgas-new rev-parse HEAD)"
          mkdir -p pgas-new/qc/evidence/${{ github.run_id }}
          # Written INTO the single evidence log rather than as its own file:
          # upload-artifact-htpc bounds observed directory entries at 3, and the
          # canary script appends to this same file with `tee -a`. Creating it
          # here also guarantees the evidence artifact is non-empty even if the
          # script dies before its first write — always-upload stays meaningful.
          {
            echo "=== provenance ==="
            echo "pgas_new_head=${head_sha}"
            echo "pgas_rc_tag=${{ inputs.pgas-rc-tag }}"
            echo "pgas_rc_sha=${{ inputs.pgas-rc-sha }}"
            echo "=================="
          } >> pgas-new/qc/evidence/${{ github.run_id }}/canary.log
          {
            echo "### Consumer bytes under test"
            echo ""
            echo "- **pgas-new HEAD:** \`${head_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must satisfy pgas-new's own `engines` (^20.19.0 || >=22.12.0). A bare
          # '20' can resolve below 20.19 and a bare '22' below 22.12, either of
          # which trips EBADENGINE on rolldown/vite and muddies the signal.
          node-version: '22.12.0'

      - name: Run canary script
        if: steps.identity.outcome == 'success'
        id: canary
        working-directory: pgas-new
        env:
          CANARY_RUN_ID: ${{ github.run_id }}
        run: |
          bash qc/scripts/run-canary.sh \
            --pgas-tarball-dir pgas-rc/ \
            --run-id "${{ github.run_id }}"

      - name: Resolve verdict
        id: verdict
        if: always()
        # § 2.4 always-emit discipline + § 2.2 defensive mapping. If the script
        # died before writing a verdict (runner OOM, cancellation, an exit code
        # outside 0/1/2), the verdict defaults to `skip` — never `pass`. An
        # unexplained crash is by definition not evidence that the rc is good.
        run: |
          # CONTRACT 3.0.0, pgas#1122 binding amendment: an identity fault is a
          # configuration/infrastructure class and must NEVER be reported as
          # `fail`. `skip` still blocks the release under the strict aggregate,
          # so nothing ships on a mismatch — but the block is attributed to the
          # release plumbing rather than slandering the consumer's product.
          classification='${{ steps.identity.outputs.classification }}'
          [ -n "$classification" ] || classification=config_infra
          if [ '${{ steps.identity.outcome }}' != 'success' ]; then
            echo "consumer identity gate did not pass (outcome='${{ steps.identity.outcome }}') — verdict=skip, classification=config_infra"
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
            echo "classification=config_infra" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          v='${{ steps.canary.outputs.verdict }}'
          case "$v" in
            pass|fail|skip) ;;
            *) echo "no/unrecognized verdict from the canary script ('$v') — defaulting to skip"; v=skip ;;
          esac
          echo "verdict=$v" >> "$GITHUB_OUTPUT"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"

      - name: Evidence artifact name
        id: evidence-name
        if: always()
        run: echo "name=pgas-new-tier1-canary-${{ inputs.pgas-rc-tag }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Upload evidence
        # § 4.4: `always()`, so a fail/skip can be post-mortemed.
        #
        # The source directory holds exactly ONE file (canary.log). This is a
        # hard constraint, not a preference: upload-artifact-htpc counts every
        # entry it observes and fails past MAX_MEMBER_COUNT = 3. § 4.2's second
        # required item (canary image build log) is N/A here — pgas-new is
        # pod-less and builds no image — so one consolidated log satisfies the
        # contract. Do not add sibling files to this directory.
        if: always()
        uses: ./pgas/.github/actions/upload-artifact-htpc
        with:
          name: ${{ steps.evidence-name.outputs.name }}
          path: pgas-new/qc/evidence/${{ github.run_id }}/
          retention-days: 14

      - name: Annotate verdict
        if: always()
        run: |
          {
            echo "## pgas-new tier-1 canary verdict"
            echo ""
            echo "- **Verdict:** ${{ steps.verdict.outputs.verdict }}"
            echo "- **Classification:** \`${{ steps.verdict.outputs.classification }}\` (config_infra = release-plumbing fault, NOT a product regression)"
            echo "- **consumer-sha requested:** \`${{ inputs.consumer-sha }}\`"
            echo "- **consumer HEAD tested:** \`${{ steps.identity.outputs.actual_head }}\`"
            echo "- **rc tag:** \`${{ inputs.pgas-rc-tag }}\`"
            echo "- **rc sha:** \`${{ inputs.pgas-rc-sha }}\`"
            echo "- **Evidence:** \`${{ steps.evidence-name.outputs.name }}\`"
            echo ""
            echo "Archetype: install the rc tarball → prove the rc is genuinely loaded"
            echo "(RC-identity gate) → typecheck against the rc's published types →"
            echo "drive the render / decision-only / delegated-child-terminal"
            echo "engine-coupled paths."
          } >> "$GITHUB_STEP_SUMMARY"
